<title>LaFête</title>
<meta name="description" content="LaFête: de feestspellen-app voor je vriendengroep.">
<script>
(function () {
  var d = document.documentElement;
  try {
    var t = localStorage.getItem('lafete:theme:v1');
    var i = localStorage.getItem('lafete:icons:v1');
    d.setAttribute('data-theme', /^(liquid-glass|party-burst|blue-sky|deep-space)$/.test(t) ? t : 'liquid-glass');
    d.setAttribute('data-icons', /^(vision-minimal|neon-glow|playful-pop)$/.test(i) ? i : 'vision-minimal');
  } catch (e) {
    d.setAttribute('data-theme', 'liquid-glass');
    d.setAttribute('data-icons', 'vision-minimal');
  }
})();
</script>
